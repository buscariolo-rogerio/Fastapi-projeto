<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>console — monitoramento</title>
  <style>
    :root{--bg:#0b0f14;--panel:#10151c;--border:#26313d;--text:#e4eaf1;--muted:#8491a0;--faint:#52606f;--accent:#4fd1c5;--ok:#3dd68c;--bad:#f97066;--warn:#f5c16c;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 0,rgba(79,209,197,.08),transparent 34%),var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}.page{max-width:1180px;margin:auto;padding:28px 20px 48px}header,.slo{display:flex;align-items:center;justify-content:space-between;gap:16px}header{margin-bottom:20px}.brand{display:flex;align-items:center;gap:10px}.dot{width:9px;height:9px;border-radius:50%;background:var(--faint)}.dot.ok{background:var(--ok);box-shadow:0 0 0 4px rgba(61,214,140,.12)}.dot.bad{background:var(--bad)}h1{font:600 19px var(--mono);margin:0}h1 span{color:var(--accent)}.sub{margin:5px 0 0;color:var(--muted);font-size:12px}.actions{display:flex;gap:8px}.actions a,.actions button{color:var(--accent);background:rgba(79,209,197,.1);border:1px solid rgba(79,209,197,.35);border-radius:999px;padding:7px 12px;text-decoration:none;font:11px var(--mono);cursor:pointer}.slo{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px}.slo.ok{border-color:rgba(61,214,140,.5);background:rgba(61,214,140,.08)}.slo.bad{border-color:rgba(249,112,102,.5);background:rgba(249,112,102,.08)}.slo strong,.section{font:11px var(--mono);letter-spacing:.12em;text-transform:uppercase}.slo p{margin:5px 0 0;color:var(--muted)}.section{color:var(--faint);margin:19px 0 8px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.card,.chart,.block{background:var(--panel);border:1px solid var(--border);border-radius:12px}.card{padding:13px}.label{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}.value{font:500 18px var(--mono);margin-top:7px}.value.small{font-size:12px;word-break:break-all}.note{color:var(--faint);font-size:10px;margin-top:5px}.charts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.chart{padding:13px}.chart h2,.block h2{margin:0 0 8px;color:var(--muted);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.08em}canvas{display:block;width:100%;height:180px}.block{overflow:auto;margin-top:10px;padding-top:13px}.block h2{padding:0 13px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}th{color:var(--faint);font:10px var(--mono);text-transform:uppercase}.mono{font-family:var(--mono)}.tag{font:10px var(--mono);padding:2px 7px;border-radius:999px}.tag.ok{color:var(--ok);background:rgba(61,214,140,.12)}.tag.erro{color:var(--bad);background:rgba(249,112,102,.12)}.tag.bloqueado{color:var(--warn);background:rgba(245,193,108,.12)}.empty{padding:14px;color:var(--faint)}#warning{color:var(--bad)}@media(max-width:800px){header{align-items:flex-start;flex-direction:column}.charts{grid-template-columns:1fr}}
  </style>
</head>
<body><main class="page">
  <header><div><div class="brand"><span id="dot" class="dot"></span><h1>assistente <span>/ monitor</span></h1></div><p id="updated" class="sub">lendo a API…</p></div><div class="actions"><a href="/">voltar ao chat</a><button id="refresh">atualizar</button></div></header>
  <section id="slo" class="slo"><div><strong id="sloTitle">SLO</strong><p id="sloText">p95 de latência e taxa de erro desta execução.</p></div></section>
  <p class="section">serviço</p><section id="service" class="cards"></section>
  <p class="section">modelo</p><section id="model" class="cards"></section>
  <section class="charts"><article class="chart"><h2>latência por turno</h2><canvas id="latency"></canvas></article><article class="chart"><h2>custo acumulado</h2><canvas id="cost"></canvas></article></section>
  <article class="block"><h2>turnos</h2><div id="turns"></div></article>
  <article class="block"><h2>por modelo</h2><div id="models"></div></article>
  <article class="block"><h2>por rota</h2><div id="routes"></div></article>
  <p id="warning" hidden></p>
</main><script>
const $=id=>document.getElementById(id), fmt=n=>Number(n||0).toLocaleString("pt-BR"), pct=n=>(100*n).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1})+"%", ms=n=>n>=1000?(n/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})+" s":Math.round(n)+" ms", usd=n=>Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"USD",minimumFractionDigits:4,maximumFractionDigits:6});
function duration(s){const m=Math.floor(s/60);return m?`${m}min ${s%60}s`:`${s}s`}function card(l,v,n="",small=false){return `<article class="card"><div class="label">${l}</div><div class="value${small?" small":""}">${v}</div>${n?`<div class="note">${n}</div>`:""}</article>`}function table(head,rows,empty){if(!rows.length)return `<p class="empty">${empty}</p>`;return `<table><thead><tr>${head.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td class="${x.c||""}">${x.v}</td>`).join("")}</tr>`).join("")}</tbody></table>`}
function line(canvas,values,color,limit=null){const c=canvas.getContext("2d"),d=devicePixelRatio||1,w=canvas.clientWidth||320,h=canvas.clientHeight||180;c.canvas.width=w*d;c.canvas.height=h*d;c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,w,h);if(!values.length){c.fillStyle="#52606f";c.fillText("sem turnos ainda",12,h/2);return}const pad={l:45,r:12,t:14,b:25},max=Math.max(...values,limit||0,1)*1.08,min=0,x=i=>pad.l+(values.length===1?(w-pad.l-pad.r)/2:i/(values.length-1)*(w-pad.l-pad.r)),y=v=>pad.t+(1-v/max)*(h-pad.t-pad.b);c.strokeStyle="#26313d";c.beginPath();c.moveTo(pad.l,pad.t);c.lineTo(pad.l,h-pad.b);c.lineTo(w-pad.r,h-pad.b);c.stroke();if(limit!==null){c.setLineDash([4,4]);c.strokeStyle="#f97066";c.beginPath();c.moveTo(pad.l,y(limit));c.lineTo(w-pad.r,y(limit));c.stroke();c.setLineDash([])}c.strokeStyle=color;c.lineWidth=2;c.beginPath();values.forEach((v,i)=>i?c.lineTo(x(i),y(v)):c.moveTo(x(i),y(v)));c.stroke();c.fillStyle=color;values.forEach((v,i)=>{c.beginPath();c.arc(x(i),y(v),3,0,Math.PI*2);c.fill()})}
function render(d){const r=d.resumo,s=d.slo,box=$("slo");box.className="slo"+(r.turnos?(r.slo_ok?" ok":" bad"):"");$("sloTitle").textContent=!r.turnos?"sem turnos":r.slo_ok?"dentro do SLO":"SLO estourou";$("sloText").textContent=!r.turnos?"Mande uma mensagem no chat para iniciar a coleta.":`p95 até ${ms(s.latencia_p95_limite_ms)} e erro até ${pct(s.taxa_erro_limite)}.`;$("service").innerHTML=[card("turnos",fmt(r.turnos)),card("taxa de erro",pct(r.taxa_erro),"exceções"),card("latência média",ms(r.latencia_media_ms)),card("latência p95",ms(r.latencia_p95_ms)),card("no ar",duration(r.no_ar_segundos)),card("em andamento",fmt(r.em_andamento)),card("bloqueios",fmt(r.bloqueios),"guardrail")].join("");$("model").innerHTML=[card("tokens",fmt(r.tokens_total),`${fmt(r.tokens_entrada)} entrada · ${fmt(r.tokens_saida)} saída`),card("custo",usd(r.custo_usd),"estimativa"),card("modelo mais usado",r.modelo_mais_usado,"",true),card("fallbacks",fmt(r.fallbacks))].join("");line($("latency"),d.serie_latencia.map(x=>x.latencia_ms),"#4fd1c5",s.latencia_p95_limite_ms);line($("cost"),d.serie_custo.map(x=>x.custo_acumulado_usd),"#7ee8dd");$("turns").innerHTML=table(["hora","latência","rota","status","tokens","custo","sessão"],d.turnos.map(t=>[{v:t.hora},{v:ms(t.latencia_ms)},{v:t.rota},{v:`<span class="tag ${t.status}">${t.status}</span>`},{v:fmt(t.tokens_total)},{v:usd(t.custo_usd)},{v:t.session_id,c:"mono"}]),"Nenhum turno neste processo.");$("models").innerHTML=table(["modelo","chamadas","entrada","saída","custo","latência"],d.por_modelo.map(m=>[{v:m.modelo,c:"mono"},{v:fmt(m.chamadas)},{v:fmt(m.tokens_entrada)},{v:fmt(m.tokens_saida)},{v:usd(m.custo_usd)},{v:ms(m.latencia_media_ms)}]),"Nenhuma chamada de modelo.");$("routes").innerHTML=table(["rota","turnos","erros","latência","custo"],d.por_rota.map(x=>[{v:x.rota},{v:fmt(x.turnos)},{v:fmt(x.erros)},{v:ms(x.latencia_media_ms)},{v:usd(x.custo_usd)}]),"Nenhuma rota ainda.")}
async function load(){try{const response=await fetch("/monitor",{cache:"no-store"});if(!response.ok)throw Error(`HTTP ${response.status}`);render(await response.json());$("dot").className="dot ok";$("updated").textContent=`atualizado ${new Date().toLocaleTimeString("pt-BR")} · a cada 4 s`;$("warning").hidden=true}catch(e){$("dot").className="dot bad";$("warning").hidden=false;$("warning").textContent=`Não consegui ler /monitor: ${e.message}`}}$("refresh").addEventListener("click",load);addEventListener("resize",load);load();setInterval(load,4000);
  </script></body>
</html>
